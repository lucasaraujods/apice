<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Moviment — Preview Mobile</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0B0B0D;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
    }
    .label {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      color: #52525a;
      text-align: center;
      margin-top: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="root"></div>
    <p class="label">iPhone 14 Pro · 390 × 844</p>
  </div>

  <script type="text/babel">
    const FRAME_W = 430;  // outer bezel width
    const FRAME_H = 932;  // outer bezel height

    const MobilePreview = () => (
      <IOSDevice width={390} height={844}>
        <iframe
          src="index.html"
          style={{ width: '100%', height: '100%', border: 'none', display: 'block', background: '#0B0B0D' }}
          title="Light Moviment Mobile"
        />
      </IOSDevice>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<MobilePreview />);
  </script>

  <script>
    function scaleStage() {
      const stage = document.getElementById('stage');
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const FRAME_W = 430;
      const FRAME_H = 932 + 32; // +32 for label
      const scaleX = (vw - 32) / FRAME_W;
      const scaleY = (vh - 32) / FRAME_H;
      const scale = Math.min(scaleX, scaleY, 1);
      stage.style.transform = `scale(${scale})`;
    }
    scaleStage();
    window.addEventListener('resize', scaleStage);
  </script>
</body>
</html>
