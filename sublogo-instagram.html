<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÁPICE — Sublogo Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B0B0D; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; gap: 0; font-family: 'Inter', sans-serif; }
    .section { width: 100%; max-width: 720px; padding: 52px 48px; border-bottom: 1px solid #1a1a1e; display: flex; flex-direction: column; align-items: center; gap: 32px; }
    .section:last-child { border-bottom: none; }
    .row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; justify-content: center; }
    .label { font-size: 9px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: #3a3a44; text-align: center; margin-top: 4px; }
    .sublabel { font-size: 8px; color: #2a2a32; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-top: 2px; }
    .on-dark { background: #0B0B0D; }
    .on-photo { background: linear-gradient(135deg,#1a2a1e 0%,#0e1a14 50%,#1a1a1e 100%); border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; position: relative; overflow: hidden; }
    .photo-bg { position: absolute; inset: 0; background: repeating-linear-gradient(45deg,#141a16 0,#141a16 2px,#111611 2px,#111611 10px); opacity: 0.4; }
  </style>
</head>
<body>

<!-- ─── VARIAÇÃO 1: Símbolo + ÁPICE horizontal compacto ─── -->
<div class="section">
  <p class="label" style="margin-top:0;font-size:10px;color:#52525a;letter-spacing:0.12em">Variação 1 — Horizontal compacta</p>
  <div class="row">

    <!-- Grande (referência) -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none" width="200">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00D67A"/>
            <stop offset="100%" stop-color="#3DEDA4"/>
          </linearGradient>
        </defs>
        <circle cx="26" cy="26" r="21" stroke="url(#g1)" stroke-width="1" fill="none"/>
        <circle cx="26" cy="14.5" r="3.8" fill="none" stroke="url(#g1)" stroke-width="1"/>
        <line x1="26" y1="18.3" x2="26" y2="30" stroke="url(#g1)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="18.5" y2="27.5" stroke="url(#g1)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="33.5" y2="27.5" stroke="url(#g1)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="18.5" y2="35.5" stroke="url(#g1)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="33.5" y2="35.5" stroke="url(#g1)" stroke-width="1" stroke-linecap="round"/>
        <line x1="56" y1="10" x2="56" y2="42" stroke="#252530" stroke-width="0.8"/>
        <text x="64" y="30" font-family="'Montserrat',sans-serif" font-weight="300" font-size="20" letter-spacing="7" fill="#F4F4F6">ÁPICE</text>
        <text x="65" y="41" font-family="'Inter',sans-serif" font-weight="300" font-size="6" letter-spacing="3.5" fill="#00D67A">PERFORMANCE SYSTEM</text>
      </svg>
      <span class="label">200px</span>
    </div>

    <!-- Médio -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none" width="120">
        <defs><linearGradient id="g1b" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <circle cx="26" cy="26" r="21" stroke="url(#g1b)" stroke-width="1" fill="none"/>
        <circle cx="26" cy="14.5" r="3.8" fill="none" stroke="url(#g1b)" stroke-width="1"/>
        <line x1="26" y1="18.3" x2="26" y2="30" stroke="url(#g1b)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="18.5" y2="27.5" stroke="url(#g1b)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="33.5" y2="27.5" stroke="url(#g1b)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="18.5" y2="35.5" stroke="url(#g1b)" stroke-width="1" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="33.5" y2="35.5" stroke="url(#g1b)" stroke-width="1" stroke-linecap="round"/>
        <line x1="56" y1="10" x2="56" y2="42" stroke="#252530" stroke-width="0.8"/>
        <text x="64" y="30" font-family="'Montserrat',sans-serif" font-weight="300" font-size="20" letter-spacing="7" fill="#F4F4F6">ÁPICE</text>
        <text x="65" y="41" font-family="'Inter',sans-serif" font-weight="300" font-size="6" letter-spacing="3.5" fill="#00D67A">PERFORMANCE SYSTEM</text>
      </svg>
      <span class="label">120px</span>
    </div>

    <!-- Pequeno (watermark) -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none" width="72">
        <defs><linearGradient id="g1c" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <circle cx="26" cy="26" r="21" stroke="url(#g1c)" stroke-width="1.2" fill="none"/>
        <circle cx="26" cy="14.5" r="3.8" fill="none" stroke="url(#g1c)" stroke-width="1.2"/>
        <line x1="26" y1="18.3" x2="26" y2="30" stroke="url(#g1c)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="18.5" y2="27.5" stroke="url(#g1c)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="33.5" y2="27.5" stroke="url(#g1c)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="18.5" y2="35.5" stroke="url(#g1c)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="33.5" y2="35.5" stroke="url(#g1c)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="56" y1="10" x2="56" y2="42" stroke="#252530" stroke-width="0.8"/>
        <text x="64" y="30" font-family="'Montserrat',sans-serif" font-weight="300" font-size="20" letter-spacing="7" fill="#F4F4F6">ÁPICE</text>
        <text x="65" y="41" font-family="'Inter',sans-serif" font-weight="300" font-size="6" letter-spacing="3.5" fill="#00D67A">PERFORMANCE SYSTEM</text>
      </svg>
      <span class="label">72px</span>
    </div>
  </div>
</div>

<!-- ─── VARIAÇÃO 2: Só símbolo (ícone solo) ─── -->
<div class="section">
  <p class="label" style="margin-top:0;font-size:10px;color:#52525a;letter-spacing:0.12em">Variação 2 — Ícone solo (stories / avatar)</p>
  <div class="row">
    <!-- Grande -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none" width="72">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <circle cx="26" cy="26" r="24" stroke="url(#g2)" stroke-width="1.2" fill="none"/>
        <circle cx="26" cy="13" r="4.2" fill="none" stroke="url(#g2)" stroke-width="1.2"/>
        <line x1="26" y1="17.2" x2="26" y2="30" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="17" y2="28" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="35" y2="28" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="17" y2="36" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="35" y2="36" stroke="url(#g2)" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="label">72px</span>
    </div>
    <!-- Avatar -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none" width="48">
        <defs><linearGradient id="g2b" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <circle cx="26" cy="26" r="24" stroke="url(#g2b)" stroke-width="1.5" fill="none"/>
        <circle cx="26" cy="13" r="4.2" fill="none" stroke="url(#g2b)" stroke-width="1.5"/>
        <line x1="26" y1="17.2" x2="26" y2="30" stroke="url(#g2b)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="17" y2="28" stroke="url(#g2b)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="35" y2="28" stroke="url(#g2b)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="17" y2="36" stroke="url(#g2b)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="35" y2="36" stroke="url(#g2b)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="label">48px</span>
    </div>
    <!-- Micro -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none" width="32">
        <defs><linearGradient id="g2c" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <circle cx="26" cy="26" r="24" stroke="url(#g2c)" stroke-width="2" fill="none"/>
        <circle cx="26" cy="13" r="4.2" fill="none" stroke="url(#g2c)" stroke-width="2"/>
        <line x1="26" y1="17.2" x2="26" y2="30" stroke="url(#g2c)" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="17" y2="28" stroke="url(#g2c)" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="22" x2="35" y2="28" stroke="url(#g2c)" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="17" y2="36" stroke="url(#g2c)" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="30" x2="35" y2="36" stroke="url(#g2c)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="label">32px</span>
    </div>
  </div>
</div>

<!-- ─── VARIAÇÃO 3: Watermark sobre foto simulada ─── -->
<div class="section">
  <p class="label" style="margin-top:0;font-size:10px;color:#52525a;letter-spacing:0.12em">Variação 3 — Watermark sobre foto (canto inferior direito)</p>
  <div class="on-photo">
    <div class="photo-bg"></div>
    <!-- Simulação de conteúdo de foto -->
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.06">
      <svg viewBox="0 0 200 200" width="160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="80" rx="30" ry="40" stroke="#fff" stroke-width="1.5"/>
        <path d="M 60 200 Q 70 130 100 120 Q 130 130 140 200" stroke="#fff" stroke-width="1.5" fill="none"/>
        <line x1="60" y1="140" x2="40" y2="180" stroke="#fff" stroke-width="1.5"/>
        <line x1="140" y1="140" x2="160" y2="180" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>
    <!-- Watermark branca semi-transparente -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none" width="110" style="position:relative;z-index:1;opacity:0.82">
      <defs><linearGradient id="gwm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
      <circle cx="26" cy="26" r="21" stroke="url(#gwm)" stroke-width="1" fill="none"/>
      <circle cx="26" cy="14.5" r="3.8" fill="none" stroke="url(#gwm)" stroke-width="1"/>
      <line x1="26" y1="18.3" x2="26" y2="30" stroke="url(#gwm)" stroke-width="1" stroke-linecap="round"/>
      <line x1="26" y1="22" x2="18.5" y2="27.5" stroke="url(#gwm)" stroke-width="1" stroke-linecap="round"/>
      <line x1="26" y1="22" x2="33.5" y2="27.5" stroke="url(#gwm)" stroke-width="1" stroke-linecap="round"/>
      <line x1="26" y1="30" x2="18.5" y2="35.5" stroke="url(#gwm)" stroke-width="1" stroke-linecap="round"/>
      <line x1="26" y1="30" x2="33.5" y2="35.5" stroke="url(#gwm)" stroke-width="1" stroke-linecap="round"/>
      <line x1="56" y1="10" x2="56" y2="42" stroke="#3a3a44" stroke-width="0.8"/>
      <text x="64" y="30" font-family="'Montserrat',sans-serif" font-weight="300" font-size="20" letter-spacing="7" fill="#F4F4F6">ÁPICE</text>
      <text x="65" y="41" font-family="'Inter',sans-serif" font-weight="300" font-size="6" letter-spacing="3.5" fill="#00D67A">PERFORMANCE SYSTEM</text>
    </svg>
  </div>
</div>

<!-- ─── VARIAÇÃO 4: Só texto — "@apice.performance" ─── -->
<div class="section">
  <p class="label" style="margin-top:0;font-size:10px;color:#52525a;letter-spacing:0.12em">Variação 4 — Handle Instagram</p>
  <div class="row">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 32" fill="none" width="280">
        <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00D67A"/><stop offset="100%" stop-color="#3DEDA4"/></linearGradient></defs>
        <text x="0" y="22" font-family="'Montserrat',sans-serif" font-weight="300" font-size="16" letter-spacing="2" fill="#52525a">@</text>
        <text x="16" y="22" font-family="'Montserrat',sans-serif" font-weight="300" font-size="16" letter-spacing="3" fill="url(#g4)">apice</text>
        <text x="75" y="22" font-family="'Montserrat',sans-serif" font-weight="200" font-size="16" letter-spacing="2" fill="#3a3a44">.performance</text>
      </svg>
      <span class="label">Handle para stories e legendas</span>
    </div>
  </div>
</div>

</body>
</html>
